team_kill.pluginState 1
// TK队友后系统发的消息
team_kill.msg "[$killerName]TK了[$deadName]，必须公屏道歉，否则10秒后被踢，你已TK队友$count次了"
// // 玩家发的话必须要包含全部字符才算道歉，注意识别不到“否定”，玩家只能在公平上打字道歉才能识别到。
team_kill.sryCheck[0] "s|r|y"
team_kill.sryCheck[1] "对|不|起"
team_kill.sryCheck[2] "抱|歉"
team_kill.sryCheck[3] "错|了"
team_kill.sryCheck[4] "不|好|意|思"
// // 道歉了，取消执行踢人的消息
team_kill.cancelExecuteMsg "[$killerName]道歉了，本次不踢"
// // 延迟多少秒执行命令
team_kill.executeDelay 10
// // 执行的命令，可以是ban等命令，官方命令如下：
// // ban $killerUid 分钟整数值 原因
// // kick $killerUid 原因
team_kill.executeCmd "kick $killerUid 原因是tk不道歉"
// // ban之后的提醒内容
team_kill.afterMsg "[$killerName]因TK队友已被踢出"

team_kill.allowTKTookObjectiveTime 20
